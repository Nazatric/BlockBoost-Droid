# ─────────────────────────────────────────────────────────────
# BlockBoost — Android Performance Engine
# Build configuration for Minecraft Java 26.1.2 (Fabric)
#
# Version facts verified on 2026-10-11 against:
#   https://github.com/FabricMC/fabric-example-mod/tree/26.1.2
#   https://github.com/FabricMC/fabric-docs/tree/main/versions/26.1.2/develop
#   https://github.com/FabricMC/fabric-loader/releases        (0.19.5)
#   https://github.com/FabricMC/fabric/releases               (0.155.3+26.1.2)
#   https://github.com/FabricMC/fabric-loom/tags              (v1.18.4 stable)
#   https://github.com/MobileGL-Dev/MobileGlues-release       (V2.0.0)
# Minecraft 26.1+ is UNOBFUSCATED: no mappings line is required, and mods are
# not remapped to intermediary (see fabric-docs porting/index for 26.1).
# ─────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Configuration cache disabled: our recon/release tasks read project state in
# doLast blocks; keeping this off makes CI output deterministic.
org.gradle.configuration-cache=false

# Fabric properties
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18.4
fabric_api_version=0.155.3+26.1.2

# Optional compile-time integrations (never required at runtime)
modmenu_version=21.0.0

# Mod properties
mod_version=1.0.0
maven_group=dev.blockboost
archives_name=blockboost
